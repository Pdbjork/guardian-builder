<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Guardian Builder Foundation mark">
  <defs>
    <linearGradient id="gbf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="100%" stop-color="#0B2A45"/>
    </linearGradient>
    <linearGradient id="gbf-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A34A"/>
      <stop offset="100%" stop-color="#8A6A1E"/>
    </linearGradient>
    <radialGradient id="gbf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F9C95" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2F9C95" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer shield silhouette (rounded, faceted at top, gentle at bottom) -->
  <path d="M100 8 L172 32 V96 C172 142 142 174 100 192 C58 174 28 142 28 96 V32 Z"
        fill="url(#gbf-bg)" stroke="url(#gbf-rim)" stroke-width="3"/>

  <!-- Subtle inner shield outline -->
  <path d="M100 22 L160 42 V96 C160 134 134 162 100 178 C66 162 40 134 40 96 V42 Z"
        fill="none" stroke="#C8A34A" stroke-width="0.7" stroke-opacity="0.45"/>

  <!-- Central glow -->
  <circle cx="100" cy="100" r="58" fill="url(#gbf-glow)"/>

  <!-- Flower of Life: 6 surrounding petals + center -->
  <g stroke="#C8A34A" stroke-width="1.6" fill="none" opacity="0.95">
    <!-- center circle -->
    <circle cx="100" cy="100" r="18"/>
    <!-- 6 surrounding circles, radius 18, centers at distance 18 from origin -->
    <g transform="translate(100 100)">
      <circle cx="0" cy="-18" r="18"/>
      <circle cx="15.59" cy="-9" r="18"/>
      <circle cx="15.59" cy="9" r="18"/>
      <circle cx="0" cy="18" r="18"/>
      <circle cx="-15.59" cy="9" r="18"/>
      <circle cx="-15.59" cy="-9" r="18"/>
    </g>
  </g>

  <!-- Outer ring of Flower of Life (12-circle completion, just the ring) -->
  <g stroke="#2F9C95" stroke-width="1.1" fill="none" opacity="0.7">
    <g transform="translate(100 100)">
      <circle cx="27" cy="-46.77" r="18"/>
      <circle cx="0" cy="-54" r="18"/>
      <circle cx="-27" cy="-46.77" r="18"/>
      <circle cx="-46.77" cy="-27" r="18"/>
      <circle cx="-54" cy="0" r="18"/>
      <circle cx="-46.77" cy="27" r="18"/>
      <circle cx="-27" cy="46.77" r="18"/>
      <circle cx="0" cy="54" r="18"/>
      <circle cx="27" cy="46.77" r="18"/>
      <circle cx="46.77" cy="27" r="18"/>
      <circle cx="54" cy="0" r="18"/>
      <circle cx="46.77" cy="-27" r="18"/>
    </g>
  </g>

  <!-- Neural nodes: human + artificial mind, joined through the center -->
  <g>
    <!-- human node (cloud-white) -->
    <circle cx="78" cy="78" r="3.4" fill="#F7F8F9"/>
    <!-- artificial node (gold) -->
    <circle cx="122" cy="122" r="3.4" fill="#C8A34A"/>
    <!-- connection (subtle, gold) -->
    <line x1="78" y1="78" x2="122" y2="122" stroke="#C8A34A" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- center node -->
    <circle cx="100" cy="100" r="3.2" fill="#F7F8F9" stroke="#C8A34A" stroke-width="0.8"/>
  </g>
</svg>
